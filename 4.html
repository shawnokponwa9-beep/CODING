<!DOCTYPE html>
<html>
    <head>
        <title>My superhero card</title>
        <style>
            body{
                background-color: Darkblue;
                color: white;
                font-family: Arial, sans-serif;
            }

            .hero-name{
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 3px 3px orange;
            }

            .tagline{
                font-style:italic;
                color:lightblue;
                text-transform: capitalize;
            }

            .label{
                text-transform; uppercase;
                text-decoration: underline;
                color:coral;
            }

            .power{
                font-weight: bold;
                color: lightgreen;
            }

            .weakness{
                text-decoration:line-through;
                color:gray;
            }

            .badge{
                font-size:28px;
                font-weight: bold;
                color:gold;
                transform: rotate(15deg);
            }

            .made-by{
                color: coral;
                font-style: italic;
            }
        </style>
    </head>

    <body>
        <h1 class="hero-name">SHAWNO</h1>
        <P class="tagline">The most powerful hero in the world</P>


        <h2 class="label">Superpowers</h2>
        <p class="power">Super strength</p>
        <p class="power">Super speed</p>
        <p class="power">Super sight</p>

        <h2 class="label">Weakness</h2>
        <p class="weakness">Homework</p>
        <p class="weakness">Broccoli</p>

        <p class="badge">Top Hero</p>

        <p class="made-by">created by Shawn</p>


    </body>
    </html>
