 <!DOCTYPE html>

<html lang="en">

<head>

<title>My hobby cards</title>

</head>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">


<style>

body {

background-color: #f9f9f9;

font-family: Arial, sans-serif;

padding: 30px 15px;

}

h1{

text-align: center;

color: #ff5a43;

}

.hobby-card{

text-align: center;

border-radius: 8px;

margin-bottom: 20px;

background-color: #fff8e1;

}

    </head>

<body>

    <h1>My Hobby Cards</h1>

    <div class="container">

        <div class="row">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Drawing</h3>
                    <p>I love sketching animals and comic characterss.</p>
                </div>
            </div>
        </div>
    </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>Football</h3>
                <p>I play football every evening with my friends.</p>
            </div>
        </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
        <div class="hobby-card">
            <h3>Reading</h3>
            <p>I enjoy reading mystery novels and science fiction books.</p>
        </div>
    </div>


    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
    </script>
